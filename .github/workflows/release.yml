name: Release

# Push a tag like v0.1.0 to build the Windows installer, the portable zip and the signed updater
# manifest, and attach them to a *draft* GitHub Release. A maintainer reviews and publishes it;
# only then does the app's update check (releases/latest/download/latest.json) see it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    # The signing secrets live in this environment; protect it with required reviewers and a
    # tag rule (v*) in Settings → Environments.
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag, version and updater key
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "tag '$env:TAG' is not vX.Y.Z" }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($cargo -ne $version) { throw "tag $version doesn't match the workspace version $cargo" }
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($conf.plugins.updater.pubkey -match 'PLACEHOLDER') { throw "plugins.updater.pubkey is still the placeholder" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Also installs the Tauri CLI, pinned to an exact version (>= 2.12.4) in app/ui/package.json.
      - name: UI dependencies
        working-directory: app/ui
        run: npm ci

      # No signing key here: the build runs every dependency's build script, proc macro and npm
      # tool, so it builds unsigned (`tauri build --no-sign`) and refuses to run if a key is set.
      - name: Build installer (unsigned)
        shell: pwsh
        run: ./app/src-tauri/scripts/build-installer.ps1

      # Only this step sees the signing key, and it runs only the pinned Tauri CLI
      # (`tauri signer sign --app-version`). It fails unless the version-bound .sig exists.
      # The job's token is read-only.
      - name: Sign installer for the updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./app/src-tauri/scripts/sign-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      # latest.json is generated here, after signing, from the .sig (-RequireSigning: no .sig, no release).
      - name: Portable zip, latest.json, checksums, release notes
        shell: pwsh
        run: >-
          ./app/src-tauri/scripts/release-assets.ps1
          -Version "${{ steps.version.outputs.version }}"
          -OutDir release-out
          -Repo "${{ github.repository }}"
          -RequireSigning

      # The helper was built fresh above (binaries/ is git-ignored and nothing is cached); fail the
      # release unless both app exes pin exactly that build's SHA-256.
      - name: Check the fast-scan helper hash
        shell: pwsh
        run: >-
          ./app/src-tauri/scripts/check-helper-hash.ps1
          -AppExe target/release/lustro.exe, target/portable/release/lustro.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-out
          path: release-out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-out
          path: release-out

      - name: Verify checksums
        working-directory: release-out/assets
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Lustro $VERSION" \
            --notes-file release-out/release-notes.md \
            release-out/assets/Lustro-Setup-"$VERSION".exe \
            release-out/assets/Lustro-"$VERSION"-portable-windows-x64.zip \
            release-out/assets/Lustro-Setup-"$VERSION".exe.sig \
            release-out/assets/latest.json \
            release-out/assets/SHA256SUMS.txt
