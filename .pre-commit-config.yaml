# Secret scanning before every commit. Set up once:
#   pip install pre-commit && pre-commit install
# gitleaks picks up .gitleaks.toml (default rules + minisign/Tauri private key rules).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
