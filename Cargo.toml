[workspace]
resolver = "2"
members = [
    "crates/lustro-core",
    "crates/lustro-scan",
    "crates/lustro-scan-helper",
    "crates/lustro-cloud",
    "crates/lustro-platform",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace.dependencies]
lustro-core = { path = "crates/lustro-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
bitflags = { version = "2", features = ["serde"] }

[workspace.lints.rust]
# Platform crates need unsafe for OS APIs; keep it in small, commented blocks.
# lustro-core forbids it outright.
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
