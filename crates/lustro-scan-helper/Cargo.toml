[package]
name = "lustro-scan-helper"
description = "Elevated helper that reads the NTFS MFT for Lustro's fast scan"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lustro-scan-helper"
path = "src/main.rs"
# The test harness would inherit the requireAdministrator manifest; main.rs has no tests.
test = false

[dependencies]
lustro-scan = { path = "../lustro-scan" }

[dev-dependencies]
lustro-core.workspace = true
tempfile = "3"

[lints]
workspace = true
