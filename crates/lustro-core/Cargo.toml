[package]
name = "lustro-core"
description = "Platform-neutral model, tree building, snapshots and insights for Lustro"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Fake file-tree generator for tests and the UI mock. Never generates real paths.
fixtures = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
