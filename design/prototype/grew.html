<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lustro · What grew</title>
<link rel="stylesheet" href="../tokens.css?v=20">
<link rel="stylesheet" href="app.css?v=20">
<style>
  .cmp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .snap { display: flex; flex-direction: column; background: var(--surface-1); border: 1px solid var(--stroke); border-radius: var(--r-md); padding: 8px 14px; cursor: pointer; min-width: 190px; }
  .snap .k { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
  .gr { grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); align-items: start; }
  .gr-left, .gr-right { display: grid; gap: var(--sp-4); min-width: 0; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .trio div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px; }
  .trio .k { font-size: var(--fs-xs); color: var(--text-3); }
  .trio .v { font-family: var(--font-mono); font-size: var(--fs-md); font-weight: var(--fw-strong); white-space: nowrap; }
  .chart svg { width: 100%; height: 190px; display: block; }
  .tbl .row { grid-template-columns: minmax(0, 1fr) 80px 80px 90px 84px; }
  .tbl .hd { font-size: var(--fs-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
  .tbl .r { text-align: right; }
  .dmap { height: 380px; }
  @media (max-width: 1100px) { .gr { grid-template-columns: 1fr; } .tbl .row { grid-template-columns: 1fr 80px 70px; } .tbl .row > :nth-child(2), .tbl .row > :nth-child(3) { display: none; } }
</style>
</head>
<body>
<main class="page">
  <div class="cmp">
    <div class="snap"><span class="k">Compare from (A)</span><span>Oct 21, 8:12 PM ▾</span></div>
    <span class="faint">▸</span>
    <div class="snap"><span class="k">To (B)</span><span>Today, 9:41 AM ▾</span></div>
    <div class="seg" id="ranges" style="margin-left:8px">
      <button class="on">Last scan</button><button>1 week</button><button>1 month</button><button>3 months</button>
    </div>
    <span class="faint" style="margin-left:auto">8 snapshots kept on this computer · nothing is uploaded</span>
  </div>

  <div class="grid gr">
    <div class="gr-left">
      <section class="card">
        <div class="card-head"><div class="ic" id="ic1"></div><h2>Net change</h2><span class="sub">A ▸ B</span></div>
        <div class="stat-big up" id="net"></div>
        <div class="trio" id="trio"></div>
      </section>
      <section class="card chart">
        <div class="card-head"><div class="ic" id="ic2"></div><h2>Used space over time</h2><span class="sub accent" id="forecast"></span></div>
        <div id="chart"></div>
      </section>
      <section class="card">
        <div class="card-head"><div class="ic" id="ic3"></div><h2>New since A</h2></div>
        <div class="list" id="newlist"></div>
      </section>
    </div>

    <div class="gr-right">
      <section class="card">
        <div class="card-head"><div class="ic" id="ic4"></div><h2>Biggest changes</h2>
          <div class="tools"><div class="seg" id="tabs"><button data-t="grew" class="on">Grew</button><button data-t="shrank">Shrank</button><button data-t="folders">By folder</button></div></div></div>
        <div class="list tbl" id="tbl"></div>
      </section>
      <section class="card">
        <div class="card-head"><div class="ic" id="ic5"></div><h2>Change map</h2><span class="sub">size = now · color = change</span>
          <div class="tools legend"><span><span class="dot" style="background:var(--grew)"></span>grew</span><span><span class="dot" style="background:var(--shrank)"></span>shrank</span><span><span class="dot" style="background:var(--surface-3)"></span>no change</span></div></div>
        <div class="dmap" id="dmap"></div>
      </section>
    </div>
  </div>
</main>

<script src="data.js?v=20"></script>
<script src="shell.js?v=20"></script>
<script src="viz.js?v=20"></script>
<script>
  Lustro.shell("grew");
  const I = Lustro.icons, $ = (id) => document.getElementById(id);
  const { root, history, drive } = Lustro.data;
  $("ic1").innerHTML = I.grew; $("ic2").innerHTML = I.overview; $("ic3").innerHTML = I.spark; $("ic4").innerHTML = I.treeIc; $("ic5").innerHTML = I.blocks;

  const leaves = Lustro.leaves(root);
  const grew = leaves.filter((l) => l.d > 0), shrank = leaves.filter((l) => l.d < 0);
  $("net").textContent = Lustro.fmt(root.d, { sign: true });
  $("trio").innerHTML = `
    <div><div class="k">Grew</div><div class="v up">${Lustro.fmt(grew.reduce((s, l) => s + l.d, 0), { sign: true })}</div></div>
    <div><div class="k">Shrank</div><div class="v down">${Lustro.fmt(shrank.reduce((s, l) => s + l.d, 0), { sign: true })}</div></div>
    <div><div class="k">New files</div><div class="v">1,284</div></div>`;

  // Deterministic little history per item for sparklines.
  const series = (n) => { const out = []; let v = n.size - n.d; for (let k = 0; k < 7; k++) { out.push(v); v += (n.d / 10) * ((k * 7 + n.name.length) % 3); } out.push(n.size); return out; };
  const spark = (vals, cls) => {
    const lo = Math.min(...vals), hi = Math.max(...vals) || 1, w = 80, h = 22;
    const pts = vals.map((v, k) => `${(k / (vals.length - 1)) * w},${h - 2 - ((v - lo) / (hi - lo || 1)) * (h - 4)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--${cls})" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  };

  function table(kind) {
    let rows;
    if (kind === "grew") rows = grew.sort((a, b) => b.d - a.d);
    else if (kind === "shrank") rows = shrank.sort((a, b) => a.d - b.d);
    else rows = Lustro.all(root).filter((n) => n.children && n.d && Lustro.depth(n) >= 2 && Lustro.depth(n) <= 4).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 8);
    $("tbl").innerHTML = `<div class="row hd"><span>Item</span><span class="r">Before</span><span class="r">Now</span><span class="r">Change</span><span class="r">Trend</span></div>` +
      rows.map((n) => `<div class="row">
        <div style="min-width:0"><div class="name">${n.isNew ? '<span class="badge">new</span> ' : ""}${n.name}</div><div class="path mono">${n.path}</div></div>
        <span class="mono muted r">${Lustro.fmt(Math.max(0, n.size - n.d))}</span>
        <span class="mono r">${Lustro.fmt(n.size)}</span>
        <span class="mono r ${n.d > 0 ? "up" : "down"}">${Lustro.fmt(n.d, { sign: true })}</span>
        <span class="r">${spark(series(n), n.d > 0 ? "grew" : "shrank")}</span></div>`).join("");
  }
  $("tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; [...$("tabs").children].forEach((x) => x.classList.toggle("on", x === b)); table(b.dataset.t); };
  $("ranges").onclick = (e) => { const b = e.target.closest("button"); if (b) [...$("ranges").children].forEach((x) => x.classList.toggle("on", x === b)); };
  table("grew");

  const newItems = leaves.filter((l) => l.d > 0 && (l.isNew || l.name.includes("tutorials") || l.name === "2026"));
  $("newlist").innerHTML = newItems.map((l) => `<div class="row" style="grid-template-columns:1fr auto"><div style="min-width:0"><div class="name">${l.name}</div><div class="path mono">${l.parent.path}</div></div><span class="mono up">+${Lustro.fmt(l.d)}</span></div>`).join("") +
    `<div class="row" style="grid-template-columns:1fr auto"><div style="min-width:0"><div class="name faint">Deleted since A: Pixel Harbor DLC, ${Lustro.P.trash} emptied</div></div><span class="mono down">−7.1 GB</span></div>`;

  // Used space chart with linear forecast.
  function chart() {
    const el = $("chart"), W = el.clientWidth || 360, H = 190, pad = { l: 34, r: 10, t: 12, b: 22 };
    const vals = history.map((h) => h.used), n = vals.length;
    const xs = vals.map((_, k) => k), mx = (n - 1) / 2, my = vals.reduce((a, b) => a + b) / n;
    const slope = xs.reduce((s, x, k) => s + (x - mx) * (vals[k] - my), 0) / xs.reduce((s, x) => s + (x - mx) ** 2, 0);
    const perWeek = slope / 2; // snapshots are ~2 weeks apart
    const weeksLeft = (drive.capacity - drive.used) / perWeek;
    $("forecast").textContent = `≈ ${perWeek.toFixed(1)} GB/week · full in ~${Math.round(weeksLeft / 4.3)} months`;
    const lo = Math.floor((Math.min(...vals) - 10) / 10) * 10, hi = Math.ceil((Math.max(...vals) + 10) / 10) * 10;
    const X = (k) => pad.l + (k / (n - 1)) * (W - pad.l - pad.r), Y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
    const line = vals.map((v, k) => `${X(k)},${Y(v)}`).join(" ");
    const area = `${X(0)},${Y(lo)} ${line} ${X(n - 1)},${Y(lo)}`;
    const grid = [lo, (lo + hi) / 2, hi].map((v) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--stroke)" stroke-dasharray="2 4"/><text x="${pad.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--text-3)">${v.toFixed(0)}</text>`).join("");
    const labels = history.map((h, k) => k % 2 ? "" : `<text x="${X(k)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--text-3)">${h.date.slice(5).replace("-", "/")}</text>`).join("");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${grid}
      <polygon points="${area}" fill="var(--lime)" fill-opacity=".10"/>
      <polyline points="${line}" fill="none" stroke="var(--lime)" stroke-width="2"/>
      ${[n - 2, n - 1].map((k, j) => `<circle cx="${X(k)}" cy="${Y(vals[k])}" r="4.5" fill="var(--surface-1)" stroke="var(--${j ? "accent" : "text-2"})" stroke-width="2"/><text x="${X(k)}" y="${Y(vals[k]) - 10}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">${j ? "B" : "A"}</text>`).join("")}
      ${labels}</svg>`;
  }
  const dmap = () => Lustro.treemap($("dmap"), { root, colorBy: "delta", maxDepth: 4 });
  chart(); dmap();
  addEventListener("resize", () => { chart(); dmap(); });
  document.addEventListener("lustro-theme", dmap);
</script>
</body>
</html>
