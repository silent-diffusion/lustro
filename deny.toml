# cargo-deny: licenses, security advisories, banned crates and dependency sources.
# CI runs `cargo deny check` (see .github/workflows/ci.yml). Locally:
#   cargo install cargo-deny --locked && cargo deny check

[graph]
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities always fail; so do unmaintained or yanked crates
# that we depend on directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Only permissive licences (plus MPL-2.0, file-level copyleft) that are compatible with
# shipping an MIT app binary.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Our own workspace crates are not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
